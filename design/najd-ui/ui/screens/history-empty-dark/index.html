<div class="flex items-center gap-space-sm">
<button aria-label="رجوع" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container-highest/60 active:scale-95 transition-all duration-150">

<main class="pt-20 px-margin-mobile max-w-md mx-auto"><div class="min-h-[70vh] flex flex-col items-center justify-center text-center px-4 py-12"><div class="w-24 h-24 rounded-full bg-surface-container-high/80 border border-white/[0.06] flex items-center justify-center text-primary mb-6 shadow-lg shadow-black/20"><span class="material-symbols-outlined text-[48px]" data-icon="movie">movie</span></div><h2 class="font-headline-lg text-headline-lg text-on-surface font-bold mb-3 tracking-tight">سجل المشاهدة فارغ</h2><p class="font-body-md text-body-md text-on-surface-variant max-w-xs leading-relaxed mb-8">الأعمال التي تبدأ بمشاهدتها ستظهر هنا تلقائياً لمتابعتها بسهولة من حيث توقفت.</p><a class="inline-flex items-center justify-center gap-2 bg-primary-container hover:bg-[#7e57c2] active:scale-95 text-white font-label-lg text-label-lg py-3.5 px-8 rounded-full shadow-lg shadow-primary-container/25 transition-all duration-200" href="#"><span class="material-symbols-outlined text-[20px]" data-icon="explore">explore</span><span>تصفح أحدث الأعمال</span></a></div></main>

<nav aria-label="التنقل السفلي" class="fixed bottom-0 inset-x-0 w-full z-50 flex justify-around items-center px-margin-mobile py-space-xs pb-safe bg-surface-container-low/90 dark:bg-surface-container-low/90 backdrop-blur-xl shadow-lg border-t-0">
<!-- 1. الرئيسية -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-space-md py-space-xs hover:text-primary-fixed dark:hover:text-primary-fixed transition-colors active:scale-95" href="#">
<span class="material-symbols-outlined text-[24px]" data-icon="home">home</span>
<span class="text-label-sm font-label-sm mt-1">الرئيسية</span>
</a>
<!-- 2. البحث -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-space-md py-space-xs hover:text-primary-fixed dark:hover:text-primary-fixed transition-colors active:scale-95" href="#">

</a>

</a>

<span class="text-label-sm font-label-sm mt-1">الإعدادات</span>

<!-- Interactive script for clear history micro-interaction -->
<script>
    document.getElementById('clear-all-btn')?.addEventListener('click', function() {
      const list = document.getElementById('watch-history-list');
      const emptyState = document.getElementById('empty-state');
      if (list && list.children.length > 0) {
        list.innerHTML = '';
        if (emptyState) emptyState.classList.remove('hidden');
      }
    });
  </script>
