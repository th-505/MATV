<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090b">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' blob: https:; worker-src 'self' blob:; frame-src https://ukrcdn.club https://ukrcdn.com https://miravd.com https://mp5.okhd.site https://mp4plus.org https://vidspeed.org https://vidmoly.net https://vidmoly.biz">
<title>مشغل MA TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
// فلتر منع النوافذ المنبثقة والإعلانات المخفية برمجياً (Anti-Popup & Clickjack Interceptor)
if (typeof window !== 'undefined') {
  const blockPopup = function() {
    console.warn("تم حظر محاولة فتح إعلان منبثق بنجاح.");
    return null;
  };
  try {
    window.open = blockPopup;
    Object.defineProperty(window, 'open', { value: blockPopup, writable: false, configurable: false });
  } catch (_) {
    window.open = blockPopup;
  }
}
</script>
<style>
:root{color-scheme:dark;--bg:#07090b;--panel:#121416;--muted:#a9a49a;--accent:#e8bd75;--gold2:#f3d7a0;--line:rgba(232,189,117,0.22)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% -20%,#6d4d2535,transparent 35%),var(--bg);color:#fff;font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:16px}.shell{width:min(1100px,100%)}.brand{display:flex;align-items:center;gap:9px;color:var(--gold2);font-weight:800;margin-bottom:12px}.mark{position:relative;width:34px;height:34px;border:3px solid var(--accent);border-radius:50%;display:inline-block}.mark:before{content:"";position:absolute;left:11px;top:7px;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid var(--gold2)}.mark:after{content:"";position:absolute;width:12px;height:4px;right:-7px;bottom:0;background:var(--accent);transform:rotate(45deg);border-radius:4px}.player{aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 60px #0008}.player video,.player iframe{width:100%;height:100%;border:0;display:block;background:#000}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.status{color:var(--muted);font-size:14px}.servers{display:flex;gap:8px;flex-wrap:wrap}.servers button{border:1px solid var(--line);border-radius:10px;background:#1d2a40;color:#fff;padding:9px 12px;cursor:pointer}.servers button.active{background:var(--accent);color:#171006}.error{padding:28px;text-align:center;color:#ffd3d3}
</style>
</head>
<body>
<main class="shell">
  <div class="brand"><span class="mark" aria-hidden="true"></span><span>MA TV</span></div>
  <div id="player" class="player"><div class="error">اختر مصدر تشغيل صالح.</div></div>
  <div class="bar"><div id="status" class="status">جاهز</div><div id="servers" class="servers"></div></div>
</main>
<script>
const params=new URLSearchParams(location.search);
const player=document.getElementById('player');
const statusEl=document.getElementById('status');
const serversEl=document.getElementById('servers');
let hls=null;
let transientObjectUrl='';
let playGeneration=0;
const TS_PACKET_SIZE=188;
const TS_CLOCK=90000;
const TS_PTS_MOD=8589934592;
const TS_DURATION_SAMPLE_BYTES=262144;
function safeSource(source){
  try{
    const url=new URL(source.url);
    if(url.protocol!=='https:'||url.username||url.password||url.port)return false;
    return true;
  }catch{return false}
}

function b64uDecode(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4)s+='=';
  const bin=atob(s);
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function extractLegacyIntent(intent){
  try{
    const q=intent.match(/[?&]data=([^#&]+)/);
    if(!q)return null;
    return JSON.parse(b64uDecode(decodeURIComponent(q[1])));
  }catch(e){
    console.warn('Legacy intent decode failed',e);
    return null;
  }
}

function normalizeServer(x={}){
  const url=String(x.url||x.src||'').trim();
  let type=String(x.type||'').toLowerCase();
  if(!type&&/\.m3u8(?:$|\?)/i.test(url))type='m3u8';
  else if(!type&&/\.mp4(?:$|\?)/i.test(url))type='mp4';
  else if(!type)type='embed';
  return {name:String(x.name||'سيرفر'),url,type};
}

function collectSources(){
  const direct=params.get('url')||params.get('src');
  if(direct)return [normalizeServer({name:'السيرفر الرئيسي',url:direct,type:params.get('type')||''})];
  const intent=params.get('intent');
  if(!intent)return [];
  const payload=extractLegacyIntent(intent);
  if(!payload)return [];
  const list=Array.isArray(payload.servers)?[...payload.servers]:[];
  if(payload.url)list.unshift({name:'السيرفر الرئيسي',url:payload.url,type:payload.type});
  return list.map(normalizeServer).filter(s=>s.url);
}

function stop(){
  playGeneration++;
  if(hls){hls.destroy();hls=null}
  if(transientObjectUrl){URL.revokeObjectURL(transientObjectUrl);transientObjectUrl=''}
  player.innerHTML='';
}

function createVideo(){
  const v=document.createElement('video');
  v.controls=true;
  v.playsInline=true;
  v.autoplay=true;
  v.preload='metadata';
  v.setAttribute('webkit-playsinline','');
  return v;
}

function bindVideoStatus(v,source,onFail,onSuccess){
  v.addEventListener('playing',()=>{
    statusEl.textContent='يعمل الآن: '+source.name;
    if(onSuccess)onSuccess();
  },{once:true});
  v.addEventListener('loadeddata',()=>{
    if(onSuccess)onSuccess();
  },{once:true});
  v.addEventListener('loadedmetadata',()=>{
    if(Number.isFinite(v.duration)&&v.duration>0)statusEl.dataset.duration=String(v.duration);
  });
  v.addEventListener('durationchange',()=>{
    if(Number.isFinite(v.duration)&&v.duration>0)statusEl.dataset.duration=String(v.duration);
  });
  v.addEventListener('error',()=>{
    const code=v.error?.code||0;
    const labels={1:'تم إيقاف التحميل',2:'خطأ في الشبكة',3:'تعذر فك ترميز الفيديو',4:'صيغة الفيديو غير مدعومة'};
    statusEl.textContent=(labels[code]||'تعذر تشغيل الفيديو')+' — '+source.name;
    if(onFail)onFail();
  });
}

function bytesLookLikeMp4(bytes){
  return bytes.length>=12&&String.fromCharCode(...bytes.slice(4,8))==='ftyp';
}

function bytesLookLikeMatroska(bytes){
  return bytes.length>=4&&bytes[0]===0x1a&&bytes[1]===0x45&&bytes[2]===0xdf&&bytes[3]===0xa3;
}

function bytesLookLikeMpegTs(bytes){
  if(bytes.length<TS_PACKET_SIZE||bytes[0]!==0x47)return false;
  if(bytes.length>=TS_PACKET_SIZE*2&&bytes[TS_PACKET_SIZE]!==0x47)return false;
  return true;
}

function bytesLookLikeHls(bytes){
  try{return new TextDecoder().decode(bytes.slice(0,64)).trimStart().startsWith('#EXTM3U')}catch{return false}
}

function contentRangeTotal(value=''){
  const m=String(value).match(/\/(\d+)\s*$/);
  const total=Number(m?.[1]||0);
  return Number.isSafeInteger(total)&&total>0?total:0;
}

function findTsSyncOffset(bytes){
  const limit=Math.min(TS_PACKET_SIZE,Math.max(0,bytes.length-TS_PACKET_SIZE));
  for(let i=0;i<=limit;i++){
    if(bytes[i]===0x47&&(i+TS_PACKET_SIZE>=bytes.length||bytes[i+TS_PACKET_SIZE]===0x47))return i;
  }
  return -1;
}

function decodePts(bytes,offset){
  if(offset+4>=bytes.length)return null;
  const b0=bytes[offset],b1=bytes[offset+1],b2=bytes[offset+2],b3=bytes[offset+3],b4=bytes[offset+4];
  if((b0&1)!==1||(b2&1)!==1||(b4&1)!==1)return null;
  return (((b0>>1)&7)*1073741824)+(b1*4194304)+(((b2>>1)&127)*32768)+(b3*128)+((b4>>1)&127);
}

function collectTsPts(bytes,absoluteStart=0){
  const sync=findTsSyncOffset(bytes);
  if(sync<0)return [];
  const out=[];
  for(let packet=sync;packet+TS_PACKET_SIZE<=bytes.length;packet+=TS_PACKET_SIZE){
    if(bytes[packet]!==0x47)continue;
    const payloadStart=(bytes[packet+1]&0x40)!==0;
    const adaptationControl=(bytes[packet+3]>>4)&3;
    if(!payloadStart||adaptationControl===0||adaptationControl===2)continue;
    let p=packet+4;
    if(adaptationControl===3){
      const adaptationLength=bytes[p]||0;
      p+=1+adaptationLength;
    }
    if(p+14>packet+TS_PACKET_SIZE||p+14>bytes.length)continue;
    if(bytes[p]!==0x00||bytes[p+1]!==0x00||bytes[p+2]!==0x01)continue;
    const streamId=bytes[p+3];
    if(!((streamId>=0xc0&&streamId<=0xef)||streamId===0xbd))continue;
    const ptsFlags=(bytes[p+7]>>6)&3;
    if(ptsFlags!==2&&ptsFlags!==3)continue;
    const pts=decodePts(bytes,p+9);
    if(pts===null)continue;
    out.push({pts,offset:absoluteStart+packet});
  }
  return out;
}

function ptsDeltaSeconds(first,last){
  if(!first||!last)return 0;
  const ticks=(last.pts-first.pts+TS_PTS_MOD)%TS_PTS_MOD;
  const seconds=ticks/TS_CLOCK;
  return Number.isFinite(seconds)&&seconds>0&&seconds<86400?seconds:0;
}

async function fetchRangeBytes(url,start,end){
  const response=await fetch(url,{headers:{Range:`bytes=${start}-${end}`},cache:'no-store'});
  if(!response.ok&&response.status!==206)throw new Error('STREAM_DURATION_PROBE_'+response.status);
  return {bytes:new Uint8Array(await response.arrayBuffer()),totalBytes:contentRangeTotal(response.headers.get('content-range'))};
}

async function probeMpegTsDuration(url,totalBytes,initialBytes){
  if(!totalBytes)return null;
  try{
    let headBytes=initialBytes;
    if(headBytes.length<TS_DURATION_SAMPLE_BYTES){
      const headEnd=Math.min(totalBytes-1,TS_DURATION_SAMPLE_BYTES-1);
      headBytes=(await fetchRangeBytes(url,0,headEnd)).bytes;
    }
    const tailStart=Math.max(0,totalBytes-TS_DURATION_SAMPLE_BYTES);
    const tail=(await fetchRangeBytes(url,tailStart,totalBytes-1)).bytes;
    const headPts=collectTsPts(headBytes,0);
    const tailPts=collectTsPts(tail,tailStart);
    if(headPts.length&&tailPts.length){
      const exact=ptsDeltaSeconds(headPts[0],tailPts[tailPts.length-1]);
      if(exact>1)return exact;
    }
    if(headPts.length>=2){
      const spanSeconds=ptsDeltaSeconds(headPts[0],headPts[headPts.length-1]);
      const spanBytes=headPts[headPts.length-1].offset-headPts[0].offset;
      if(spanSeconds>0.5&&spanBytes>0){
        const estimated=totalBytes/(spanBytes/spanSeconds);
        if(Number.isFinite(estimated)&&estimated>1&&estimated<86400)return estimated;
      }
    }
  }catch(e){
    console.warn('MPEG-TS duration probe failed',e);
  }
  return null;
}

async function inspectStream(url){
  const response=await fetch(url,{headers:{Range:'bytes=0-4095'},cache:'no-store'});
  if(!response.ok&&response.status!==206)throw new Error('STREAM_PROBE_'+response.status);
  const contentType=String(response.headers.get('content-type')||'').toLowerCase();
  const totalBytes=contentRangeTotal(response.headers.get('content-range'));
  const bytes=new Uint8Array(await response.arrayBuffer());
  const mp4=bytesLookLikeMp4(bytes)||contentType.includes('video/mp4');
  const matroska=bytesLookLikeMatroska(bytes)||contentType.includes('matroska')||contentType.includes('webm');
  const mpegTs=bytesLookLikeMpegTs(bytes)||contentType.includes('video/mp2t');
  const hls=bytesLookLikeHls(bytes)||contentType.includes('mpegurl');
  return {contentType,mp4,matroska,mpegTs,hls,totalBytes,bytes};
}

function playHls(source,onFail,onSuccess){
  const v=createVideo();
  bindVideoStatus(v,source,onFail,onSuccess);
  player.appendChild(v);
  if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src=source.url;
  }else if(window.Hls&&Hls.isSupported()){
    hls=new Hls({enableWorker:true,maxBufferLength:15,maxMaxBufferLength:30});
    hls.loadSource(source.url);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      if(onSuccess)onSuccess();
      v.play().catch(()=>{});
    });
    hls.on(Hls.Events.ERROR,(_,d)=>{
      if(d.fatal){
        statusEl.textContent='تعذر تشغيل البث عبر '+source.name;
        if(onFail)onFail();
      }
    });
  }else{
    v.src=source.url;
  }
  v.play().catch(()=>{});
}

async function playMpegTsAsHls(source,inspection,generation,onFail,onSuccess){
  const duration=await probeMpegTsDuration(source.url,inspection.totalBytes,inspection.bytes);
  if(generation!==playGeneration)return;
  const segmentUrl=new URL(source.url,location.href).href;
  const durationKnown=Number.isFinite(duration)&&duration>1;
  const extinf=durationKnown?Math.max(1,duration):10;
  const manifest=[
    '#EXTM3U',
    '#EXT-X-VERSION:3',
    durationKnown?'#EXT-X-PLAYLIST-TYPE:VOD':'#EXT-X-PLAYLIST-TYPE:EVENT',
    '#EXT-X-TARGETDURATION:'+Math.max(1,Math.ceil(extinf)),
    '#EXT-X-MEDIA-SEQUENCE:0',
    '#EXTINF:'+extinf.toFixed(3)+',',
    segmentUrl,
    ...(durationKnown?['#EXT-X-ENDLIST']:[]),
    '',
  ].join('\n');
  transientObjectUrl=URL.createObjectURL(new Blob([manifest],{type:'application/vnd.apple.mpegurl'}));
  statusEl.dataset.mpegTsDuration=durationKnown?String(duration):'unknown';
  statusEl.textContent=durationKnown
    ?'تم التحقق من MPEG-TS — مدة المصدر '+Math.round(duration)+' ثانية — جارٍ التشغيل عبر HLS'
    :'تم التحقق من MPEG-TS — مدة المصدر غير متاحة بشكل موثوق، جارٍ التشغيل دون مدة VOD مصطنعة';
  playHls({...source,url:transientObjectUrl,type:'m3u8'},onFail,onSuccess);
}

async function playDirectStream(source,generation,onFail,onSuccess){
  let inspection=null;
  try{
    inspection=await inspectStream(source.url);
  }catch(e){
    console.warn('Stream preflight failed',e);
  }
  if(generation!==playGeneration)return;
  if(inspection?.hls){
    playHls({...source,type:'m3u8'},onFail,onSuccess);
    return;
  }
  if(inspection?.mpegTs){
    await playMpegTsAsHls(source,inspection,generation,onFail,onSuccess);
    return;
  }
  const v=createVideo();
  bindVideoStatus(v,source,onFail,onSuccess);
  player.appendChild(v);
  const src=document.createElement('source');
  src.src=source.url;
  if(inspection?.mp4)src.type='video/mp4';
  v.appendChild(src);
  v.load();
  if(inspection?.matroska){
    statusEl.textContent='المصدر بصيغة Matroska/WebM وغير مدعوم مباشرة في Safari؛ جارٍ تجربة التشغيل المتاح';
  }else if(inspection?.mp4){
    statusEl.textContent='تم التحقق من MP4 — جارٍ التشغيل';
  }else if(inspection?.contentType){
    statusEl.textContent='جارٍ التشغيل ('+inspection.contentType+')';
  }
  v.play().catch(()=>{});
}

function play(source,onFail,onSuccess){
  stop();
  if(!safeSource(source)){
    statusEl.textContent='المصدر غير موثوق أو لا يدعم التشغيل الآمن';
    if(onFail)onFail();
    return;
  }
  const generation=playGeneration;
  statusEl.textContent='جارٍ تشغيل '+source.name;
  delete statusEl.dataset.mpegTsDuration;
  delete statusEl.dataset.duration;
  document.querySelectorAll('.servers button').forEach(b=>b.classList.toggle('active',b.dataset.url===source.url));
  if(source.type==='m3u8'){
    playHls(source,onFail,onSuccess);
  }else if(source.type==='mp4'||source.type==='stream'){
    playDirectStream(source,generation,onFail,onSuccess);
  }else{
    // مصدر خارجي يحظره المتصفح عبر Iframe بسبب X-Frame-Options أو CSP على صفحات GitHub
    player.innerHTML=`
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:360px;color:#fff;text-align:center;padding:24px;background:radial-gradient(circle at center, #151d2a 0%, #07090b 100%);">
        <p style="margin-bottom:16px;font-size:1rem;color:#e8bd75;">عذراً، هذا المصدر يحيل إلى مشغل خارجي يحظره المتصفح أمنياً.</p>
        <a href="${source.url}" target="_blank" rel="noopener noreferrer" style="background:#e8bd75;color:#111;padding:12px 26px;border-radius:10px;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;gap:8px;">
          <span>تشغيل المشغل الخارجي في نافذة مستقلة</span> <span>🚀</span>
        </a>
      </div>
    `;
    if(onSuccess)onSuccess();
  }
}

let fastFailoverTimer=null;
let currentSourcesQueue=[];
let currentQueueIdx=0;

function forceFastStreamResolution(sourcesList,startSource=null){
  if(!sourcesList||!sourcesList.length)return;

  // إجبار الروابط المباشرة وتخطي الـ Embed الثقيل
  const cleanList=(sourcesList||[]).filter(s=>{
    const u=String(s.url||'').toLowerCase();
    return !/vidsrc|multiembed|autoembed|2embed|111movies|embed\.su|vidlink|123embed/i.test(u);
  });
  const activeSources = cleanList.length > 0 ? cleanList : sourcesList;

  let sorted=[...activeSources].sort((a,b)=>{
    const aDirect=(a.type==='m3u8'||a.type==='mp4'||a.type==='stream'||/\.m3u8|\.mp4/i.test(a.url))?0:1;
    const bDirect=(b.type==='m3u8'||b.type==='mp4'||b.type==='stream'||/\.m3u8|\.mp4/i.test(b.url))?0:1;
    if(aDirect!==bDirect)return aDirect-bDirect;
    return (a.ms||999)-(b.ms||999);
  });

  if(startSource){
    sorted=[startSource,...sorted.filter(s=>s.url!==startSource.url)];
  }

  currentSourcesQueue=sorted;
  currentQueueIdx=0;

  function tryPlayNext(){
    clearTimeout(fastFailoverTimer);
    if(currentQueueIdx>=currentSourcesQueue.length){
      statusEl.textContent='عذراً، جميع السيرفرات بطيئة أو لا ترد حالياً.';
      return;
    }

    const srv=currentSourcesQueue[currentQueueIdx++];
    statusEl.textContent=`جاري تجربة السيرفر الأسرع: ${srv.name}...`;

    // مهلة 3 ثوانٍ فقط للقفز الفوري للسيرفر الأسرع
    fastFailoverTimer=setTimeout(()=>{
      console.warn(`السيرفر ${srv.name} تجاوز 3 ثوانٍ، جاري القفز للأسرع...`);
      tryPlayNext();
    },3000);

    play(srv,()=>{
      clearTimeout(fastFailoverTimer);
      tryPlayNext();
    },()=>{
      clearTimeout(fastFailoverTimer);
    });
  }

  tryPlayNext();
}

const sources=collectSources();
if(!sources.length){
  statusEl.textContent='لم يصل رابط تشغيل صالح';
}else{
  serversEl.innerHTML='';
  const safeSources=sources.filter(safeSource);
  safeSources.forEach((s)=>{
    const b=document.createElement('button');b.textContent=s.name;b.dataset.url=s.url;b.onclick=()=>forceFastStreamResolution(safeSources,s);serversEl.appendChild(b);
  });
  if(!serversEl.children.length){
    statusEl.textContent='لا توجد مصادر آمنة متاحة للتشغيل';
  }else{
    forceFastStreamResolution(safeSources);
  }
}
</script>
</body>
</html>
