name: mitv
publish_to: none
description: MITV cross-platform media client with direct edge-resolved playback.
version: 1.0.43+43

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path_provider: ^2.1.5
  wakelock_plus: ^1.5.2
  screen_brightness: ^2.1.11
  share_plus: ^10.1.4
  shared_preferences: ^2.5.3
  video_player: ^2.14.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: 6.9.0

flutter:
  uses-material-design: true
