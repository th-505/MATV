name: mitv
publish_to: none
description: Najd TV shared cross-platform media client.
version: 1.1.5+105

environment:
  sdk: ">=3.13.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: 6.3.3
  archive: 4.5.2
  http: ^1.5.0
  supabase_flutter: 2.18.3
  file_selector: 1.1.0
  enough_convert: 1.7.1
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path_provider: ^2.1.5
  wakelock_plus: ^1.5.2
  screen_brightness: ^2.1.11
  share_plus: ^10.1.4
  shared_preferences: ^2.5.3
  video_player: ^2.14.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: 6.9.0

flutter:
  uses-material-design: true
  fonts:
    - family: NajdArabicFallback
      fonts:
        - asset: assets/fallback/NotoSansArabic.ttf
  assets:
    - assets/najd/
    - assets/najd/fonts/
