<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MITV | 4BA — منصة البث السينمائي الفاخرة">
  <meta name="theme-color" content="#07090b">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MITV | 4BA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MITV | 4BA</title>
  <style>
    body {
      background-color: #07090b;
      margin: 0;
      padding: 0;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #07090b;
      z-index: 9999;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .splash-crest {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #18202d, #090c10);
      border: 2px solid #e8bd75;
      color: #e8bd75;
      font-size: 22px;
      font-weight: 900;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 30px rgba(232, 189, 117, 0.3);
      margin-bottom: 16px;
    }
    .splash-title {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .splash-title span {
      background: linear-gradient(135deg, #f7d594 0%, #e8bd75 50%, #b88b3e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .splash-sub {
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: #e8bd75;
      opacity: 0.8;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .splash-loader {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .splash-loader::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #f7d594, #e8bd75);
      border-radius: 999px;
      animation: loaderSlide 1.2s infinite ease-in-out;
    }
    @keyframes loaderSlide {
      0% { left: -40%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-crest">4BA</div>
    <div class="splash-title">MITV <span>| 4BA</span></div>
    <div class="splash-sub">VIP CINEMA</div>
    <div class="splash-loader"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) {
        s.style.opacity = '0';
        setTimeout(function () { s.remove(); }, 400);
      }
    });
  </script>
</body>
</html>
