name: Repository Health Check

# يعمل هذا الفحص تلقائياً عند أي عملية رفع (push) أو طلب دمج (pull_request)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      # 1. سحب ملفات المشروع إلى سيرفر الفحص
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. تجهيز بيئة بايثون على سيرفر GitHub
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. تشغيل أداة فحص نظافة المستودع التي أنشأناها
      - name: Run Repo Health Checker
        run: python .github/scripts/check_repo_health.py
