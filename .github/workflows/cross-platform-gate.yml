name: MATV cross-platform source gate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Syntax check web and server
        run: |
          node --check server/app.mjs
          node --check server/discovery-coordinator.mjs
          node --check server/provider-store.mjs
          node --check web/core/ma-nexus.js
      - name: Run background discovery and TMDB tests
        run: node --test tests/discovery-coordinator.test.mjs tests/tmdb-failover.test.mjs tests/security-boundary.test.mjs tests/episode-identity.test.mjs
      - name: Security boundary regressions
        run: node scripts/ssrf_http_guard_test.mjs && node scripts/cors_boundary_test.mjs && node scripts/tmdb_catalog_security_test.mjs
      - name: Validate web install manifest
        run: |
          node --input-type=module -e "import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('manifest.json'));if(!p.name||!p.start_url||!p.icons?.length)process.exit(1)"
  native-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the actual shared Flutter source and platform contract
        run: python3 scripts/platform_parity_test.py
