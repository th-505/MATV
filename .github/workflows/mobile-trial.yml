name: Najd TV unified six-target release

on:
  push:
    branches: ['build/mitv-*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish only after verification; false produces reviewable artifacts without deploying
        required: false
        default: true
        type: boolean
      font_bundle_url:
        description: Private user font bundle URL for native builds only
        required: false
        type: string
      api_base:
        description: Verified public metadata API URL
        required: true
        default: https://matv.onrender.com
        type: string

permissions:
  contents: read

concurrency:
  group: najd-production-source
  cancel-in-progress: true

env:
  MITV_API_BASE: ${{ inputs.api_base || 'https://matv.onrender.com' }}
  MITV_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-branding.txt
      - run: npm ci
      - run: node scripts/runtime_version_contract_test.mjs
      - run: npm run check
      - run: npm run test:continuation
      - run: node --test tests/*.test.mjs
      - run: python3 scripts/native_network_config_test.py

  verify-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate deployment URL and health
        run: |
          python3 - <<'PY'
          import os, urllib.parse, urllib.request
          url = urllib.parse.urlsplit(os.environ['MITV_API_BASE'])
          assert url.scheme == 'https' and url.hostname and not url.username and not url.password
          assert not url.query and not url.fragment and url.path in ('', '/')
          with urllib.request.urlopen(os.environ['MITV_API_BASE'].rstrip('/') + '/health', timeout=90) as response:
              assert response.status == 200
          PY

  android:
    needs: [verify-api, providers]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mobile
            platform: android-arm64
            abi: arm64-v8a
            artifact: Najd-TV-Android-Mobile-ARM64
            manifest_target: android-mobile-arm64
            version_offset: 2000
          - target: tv
            platform: android-arm
            abi: armeabi-v7a
            artifact: Najd-TV-Android-TV-ARM32
            manifest_target: android-tv-armv7
            version_offset: 1000
    env:
      APP_TARGET: ${{ matrix.target }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ABI: ${{ matrix.abi }}
      ARTIFACT_NAME: ${{ matrix.artifact }}
      MANIFEST_TARGET: ${{ matrix.manifest_target }}
      VERSION_OFFSET: ${{ matrix.version_offset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Create Android scaffolding
        working-directory: flutter_app
        run: flutter create --platforms=android --org com.mitv --project-name mitv .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare private native typography without committing originals
        if: inputs.font_bundle_url != ''
        env:
          NAJD_FONT_BUNDLE_URL: ${{ inputs.font_bundle_url }}
        run: python scripts/fetch_private_build_fonts.py
      - name: Install pinned icon packager
        run: python -m pip install -r scripts/requirements-branding.txt
      - name: Apply native branding and TV manifest
        run: |
          python3 scripts/apply_native_branding.py flutter_app
          if [ "$APP_TARGET" = tv ]; then python3 scripts/configure_tv_manifest.py flutter_app; fi
      - name: Resolve dependencies
        working-directory: flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Analyze and test
        working-directory: flutter_app
        run: |
          flutter analyze
          flutter test --dart-define="MITV_TARGET=$APP_TARGET"
          dart run tool/alooy_bridge_smoke.dart
      - name: Build architecture-specific APK with all codecs
        working-directory: flutter_app
        run: flutter build apk --release --split-per-abi --target-platform="$TARGET_PLATFORM" --dart-define="MITV_TARGET=$APP_TARGET" --dart-define="MITV_API_BASE=$MITV_API_BASE"
      - name: Verify signature, version, size and native configuration
        run: |
          set -euo pipefail
          APK="flutter_app/build/app/outputs/flutter-apk/app-$EXPECTED_ABI-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify "$APK"
          "$AAPT" dump permissions "$APK" > /tmp/mitv-permissions.txt
          grep -q android.permission.INTERNET /tmp/mitv-permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/mitv-manifest.txt
          grep -q networkSecurityConfig /tmp/mitv-manifest.txt
          "$AAPT" dump badging "$APK" > /tmp/mitv-badging.txt
          grep -q "package: name='com.mitv.mitv'" /tmp/mitv-badging.txt
          grep -q "application-label:'Najd TV'" /tmp/mitv-badging.txt
          grep -qx "native-code: '$EXPECTED_ABI'" /tmp/mitv-badging.txt || { cat /tmp/mitv-badging.txt; exit 1; }
          if [ "$APP_TARGET" = tv ]; then grep -q android.software.leanback /tmp/mitv-badging.txt; fi
          python3 - <<'PY'
          import os, pathlib, re
          version, build = re.search(r'^version: (\d+\.\d+\.\d+)\+(\d+)$', pathlib.Path('flutter_app/pubspec.yaml').read_text(), re.M).groups()
          badging = pathlib.Path('/tmp/mitv-badging.txt').read_text()
          assert f"versionName='{version}'" in badging
          assert f"versionCode='{int(os.environ['VERSION_OFFSET']) + int(build)}'" in badging
          apk = pathlib.Path('flutter_app/build/app/outputs/flutter-apk') / f"app-{os.environ['EXPECTED_ABI']}-release.apk"
          assert apk.stat().st_size <= 35 * 1024 * 1024, 'APK exceeds approved 35 MiB limit'
          PY
          mkdir -p trial
          cp "$APK" "trial/$ARTIFACT_NAME.apk"
          (cd trial && sha256sum "$ARTIFACT_NAME.apk" > "$ARTIFACT_NAME.apk.sha256")
      - name: Record immutable source identity
        run: python3 scripts/write_source_manifest.py --target "$MANIFEST_TARGET" --output trial/source-manifest.json --api "$MITV_API_BASE" --sha "$MITV_SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: trial/
          retention-days: 14
          if-no-files-found: error

  ios-unsigned:
    needs: [verify-api, providers]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3 for AVFoundation Swift isolation APIs
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          swift --version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Create iOS scaffolding
        working-directory: flutter_app
        run: flutter create --platforms=ios --org com.mitv --project-name mitv .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare private native typography without committing originals
        if: inputs.font_bundle_url != ''
        env:
          NAJD_FONT_BUNDLE_URL: ${{ inputs.font_bundle_url }}
        run: python scripts/fetch_private_build_fonts.py
      - name: Install pinned icon packager
        run: python -m pip install -r scripts/requirements-branding.txt
      - name: Apply native branding
        run: python3 scripts/apply_native_branding.py flutter_app
      - name: Resolve dependencies
        working-directory: flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Build unsigned iPhone app
        working-directory: flutter_app
        run: flutter build ios --release --no-codesign --dart-define=MITV_TARGET=ios --dart-define="MITV_API_BASE=$MITV_API_BASE"
      - name: Package unsigned IPA for external signing
        run: |
          set -euo pipefail
          test -s flutter_app/build/ios/iphoneos/Runner.app/Runner
          mkdir -p trial/Payload
          cp -R flutter_app/build/ios/iphoneos/Runner.app trial/Payload/Runner.app
          rm -rf trial/Payload/Runner.app/_CodeSignature
          rm -f trial/Payload/Runner.app/embedded.mobileprovision
          codesign --remove-signature trial/Payload/Runner.app 2>/dev/null || true
          if codesign --verify trial/Payload/Runner.app 2>/dev/null; then echo 'Unexpected signed app'; exit 1; fi
          lipo trial/Payload/Runner.app/Runner -verify_arch arm64
          cd trial
          ditto -c -k --keepParent Payload Najd-TV-iPhone-Unsigned.ipa
          shasum -a 256 Najd-TV-iPhone-Unsigned.ipa > Najd-TV-iPhone-Unsigned.ipa.sha256
          rm -rf Payload
      - name: Record immutable source identity
        run: python3 scripts/write_source_manifest.py --target ios-unsigned-arm64 --output trial/source-manifest.json --api "$MITV_API_BASE" --sha "$MITV_SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: Najd-TV-iPhone-Unsigned
          path: trial/
          retention-days: 14
          if-no-files-found: error

  windows:
    needs: [verify-api, providers]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Create Windows scaffolding
        working-directory: flutter_app
        run: flutter create --platforms=windows --org com.mitv --project-name mitv .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare private native typography without committing originals
        if: inputs.font_bundle_url != ''
        env:
          NAJD_FONT_BUNDLE_URL: ${{ inputs.font_bundle_url }}
        run: python scripts/fetch_private_build_fonts.py
      - name: Install pinned icon packager
        run: python -m pip install -r scripts/requirements-branding.txt
      - name: Apply Najd TV desktop identity
        run: python scripts/apply_native_branding.py flutter_app
      - name: Resolve dependencies and test
        working-directory: flutter_app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test --dart-define=MITV_TARGET=desktop
      - name: Build native Windows x64 app
        working-directory: flutter_app
        run: flutter build windows --release --dart-define=MITV_TARGET=desktop --dart-define="MITV_API_BASE=$env:MITV_API_BASE"
      - name: Package complete native bundle and installer
        shell: pwsh
        run: |
          $sourceRoot = (Resolve-Path flutter_app/build/windows/x64/runner/Release).Path
          if (!(Test-Path "$sourceRoot/mitv.exe")) { throw 'Missing MITV executable' }
          $decoder = Get-ChildItem $sourceRoot -Filter '*mpv*.dll'
          if (!$decoder) { throw 'Missing bundled libmpv' }
          New-Item -ItemType Directory trial -Force | Out-Null
          Compress-Archive -Path "$sourceRoot/*" -DestinationPath trial/Najd-TV-Windows-x64.zip
          $compiler = Get-ChildItem 'C:/Program Files (x86)', 'C:/Program Files' -Directory -Filter 'Inno Setup*' | ForEach-Object { Join-Path $_.FullName 'ISCC.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$compiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
            $compiler = Get-ChildItem 'C:/Program Files (x86)', 'C:/Program Files' -Directory -Filter 'Inno Setup*' | ForEach-Object { Join-Path $_.FullName 'ISCC.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (!$compiler) { throw 'Inno Setup compiler not found' }
          }
          $version = (Select-String -Path flutter_app/pubspec.yaml -Pattern '^version: (\d+\.\d+\.\d+)\+').Matches[0].Groups[1].Value
          $outputRoot = (Resolve-Path trial).Path
          & $compiler "/DAppVersion=$version" "/DSourceRoot=$sourceRoot" "/DOutputRoot=$outputRoot" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'mitv-install-check'
          $setup = Start-Process -FilePath "$outputRoot/Najd-TV-Windows-x64-Setup.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installRoot") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Installer smoke test failed' }
          foreach ($file in Get-ChildItem $sourceRoot -Recurse -File) {
            $relative = [IO.Path]::GetRelativePath($sourceRoot, $file.FullName)
            $installed = Join-Path $installRoot $relative
            if (!(Test-Path $installed) -or (Get-FileHash $file.FullName).Hash -ne (Get-FileHash $installed).Hash) { throw "Installed file mismatch: $relative" }
          }
          foreach ($file in Get-ChildItem trial -File) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)" | Set-Content -Encoding ascii "$($file.FullName).sha256"
          }
      - name: Record immutable source identity
        shell: pwsh
        run: python scripts/write_source_manifest.py --target windows-x64 --output trial/source-manifest.json --api "$env:MITV_API_BASE" --sha "$env:MITV_SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: Najd-TV-Windows-x64
          path: trial/
          retention-days: 14
          if-no-files-found: error

  macos:
    needs: [verify-api, providers]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3 for AVFoundation Swift isolation APIs
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          swift --version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Create macOS scaffolding
        working-directory: flutter_app
        run: flutter create --platforms=macos --org com.mitv --project-name mitv .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare private native typography without committing originals
        if: inputs.font_bundle_url != ''
        env:
          NAJD_FONT_BUNDLE_URL: ${{ inputs.font_bundle_url }}
        run: python scripts/fetch_private_build_fonts.py
      - name: Install pinned icon packager
        run: python -m pip install -r scripts/requirements-branding.txt
      - name: Apply Najd TV identity and sandbox entitlements
        run: python3 scripts/apply_native_branding.py flutter_app
      - name: Resolve dependencies and analyze
        working-directory: flutter_app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
      - name: Build native macOS app for the hosted runner architecture
        working-directory: flutter_app
        run: flutter build macos --release --dart-define=MITV_TARGET=desktop --dart-define="MITV_API_BASE=$MITV_API_BASE"
      - name: Package and verify DMG without Apple signing or notarization
        run: |
          set -euo pipefail
          APP_PATH="$(find flutter_app/build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          bash scripts/package_macos_dmg.sh "$APP_PATH" trial flutter_app/macos/Runner/Release.entitlements
      - name: Record immutable source identity
        run: python3 scripts/write_source_manifest.py --target macos-native --output trial/source-manifest.json --api "$MITV_API_BASE" --sha "$MITV_SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: Najd-TV-macOS-Unsigned
          path: trial/
          retention-days: 14
          if-no-files-found: error

  web:
    needs: [verify-api, providers]
    uses: ./.github/workflows/flutter-web.yml
    with:
      api_base: ${{ inputs.api_base || 'https://matv.onrender.com' }}

  verify-release:
    needs: [android, ios-unsigned, windows, macos, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: device-artifacts
      - name: Verify the complete six-target release
        run: |
          set -euo pipefail
          read VERSION BUILD < <(python3 - <<'PY'
          import pathlib, re
          match = re.search(r'^version: (\d+\.\d+\.\d+)\+(\d+)$', pathlib.Path('flutter_app/pubspec.yaml').read_text(), re.M)
          assert match
          print(*match.groups())
          PY
          )
          python3 scripts/verify_device_artifacts.py device-artifacts "$MITV_API_BASE" "$VERSION" "$BUILD" "$MITV_SOURCE_COMMIT" > device-verification.json
          cat device-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: Najd-TV-device-verification
          path: device-verification.json
          retention-days: 14
          if-no-files-found: error
      - name: Deploy verified Web bundle only behind server authentication
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$MITV_SOURCE_COMMIT" origin/main
          git diff --exit-code "$MITV_SOURCE_COMMIT" origin/main -- flutter_app shared assets/brand
          python3 - <<'PYWEB'
          import pathlib, zipfile, shutil
          archive=pathlib.Path('device-artifacts/Najd-TV-Flutter-Web/Najd-TV-Web.zip')
          destination=pathlib.Path('/tmp/najd-internal-web')
          with zipfile.ZipFile(archive) as package:
              for name in package.namelist():
                  path=pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert not ('thmanyah' in name.lower() and path.suffix.lower() in ('.otf','.ttf','.woff','.woff2')), 'Private font publication forbidden'
              package.extractall(destination)
          PYWEB
          git checkout -B main origin/main
          rm -rf internal_web
          mkdir internal_web
          cp -R /tmp/najd-internal-web/. internal_web/
          git add internal_web
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Deploy verified Najd internal Web bundle [skip ci]'
            git push origin main
          fi
      - name: Publish all verified packages together
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          version, build = re.search(r'^version: (\d+\.\d+\.\d+)\+(\d+)$', pathlib.Path('flutter_app/pubspec.yaml').read_text(), re.M).groups()
          report = json.loads(pathlib.Path('device-verification.json').read_text())
          assert report
          pathlib.Path('/tmp/release-notes.md').write_text(
              f"Najd TV {version} — beta 1 (build {build}).\n\n"
              "Independent Brstej and Fosta adapters, server-driven provider discovery, grouped parallel search and source-owned episode indexes. Compact player controls, configurable temporary hold speed, synchronized manual source switching, cast filmographies and Arabic/English display metadata.\n\n"
              "Adaptive layouts use the actual viewport, pixel ratio, safe insets and accessibility text scale. The latest layout profile is stored locally and hidden from the interface; physical screen inches are not guessed.\n\n"
              "Packages: Android Mobile ARM64, Android TV ARMv7, unsigned iOS IPA, Windows x64 installer/portable ZIP and macOS DMG. Native packages include the privately supplied original Thmanyah font; public Web uses its licensed fallback and supports local font import.\n\n"
              "Public application: https://th-505.github.io/NajdTV/\n\n"
              "The iOS IPA requires external signing. macOS is ad-hoc signed and not notarized; Windows is not Authenticode signed. Automated architecture, checksum, source identity, adaptive layout and Chromium MP4/HLS fixture checks passed. Physical-device certification and availability of every third-party provider are not claimed. Offline HLS downloading remains unsupported.\n\n"
              f"Source commit: `{os.environ['MITV_SOURCE_COMMIT']}`\n", encoding='utf-8')
          pathlib.Path('/tmp/mitv-release-version').write_text(version)
          PY
          VERSION="$(cat /tmp/mitv-release-version)"
          shopt -s nullglob
          ASSETS=(device-artifacts/*/*.apk device-artifacts/*/*.ipa device-artifacts/*/*.exe device-artifacts/*/*.zip device-artifacts/*/*.dmg device-artifacts/*/*.sha256 device-artifacts/*/macOS-report.json device-verification.json)
          PUBLIC_ASSETS=()
          for ASSET in "${ASSETS[@]}"; do
            case "$ASSET" in *Najd-TV-Flutter-Web/*) continue ;; esac
            PUBLIC_ASSETS+=("$ASSET")
          done
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$MITV_SOURCE_COMMIT" --prerelease --title "Najd TV $VERSION — Beta 1" --notes-file /tmp/release-notes.md "${PUBLIC_ASSETS[@]}"
