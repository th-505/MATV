name: MATV device trials

on:
  push:
    branches: ['build/matv-*']
  workflow_dispatch:
    inputs:
      api_base:
        description: Verified public API URL (Render)
        required: true
        type: string

permissions:
  contents: write

jobs:
  providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python3 scripts/native_network_config_test.py
  verify-api:
    runs-on: ubuntu-latest
    env:
      MATV_API_BASE: ${{ inputs.api_base || 'https://matv.onrender.com' }}
    steps:
      - name: Validate deployment URL and health
        run: |
          python3 - <<'PY'
          import os, urllib.parse, urllib.request
          url = urllib.parse.urlsplit(os.environ['MATV_API_BASE'])
          assert url.scheme == 'https' and url.hostname and not url.username and not url.password
          assert not url.query and not url.fragment and url.path in ('', '/')
          with urllib.request.urlopen(os.environ['MATV_API_BASE'].rstrip('/') + '/health', timeout=90) as response:
              assert response.status == 200
          PY

  android:
    needs: [verify-api, providers]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mobile
            platform: android-arm64
            abi: arm64-v8a
            artifact: MATV-Android-Mobile-ARM64
          - target: tv
            platform: android-arm
            abi: armeabi-v7a
            artifact: MATV-Android-TV-ARM32
    env:
      MATV_API_BASE: ${{ inputs.api_base || 'https://matv.onrender.com' }}
      APP_TARGET: ${{ matrix.target }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ABI: ${{ matrix.abi }}
      ARTIFACT_NAME: ${{ matrix.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Create Android scaffolding
        working-directory: flutter_app
        run: flutter create --platforms=android --org com.alqahtani --project-name al_qahtani .
      - name: Apply native branding and TV manifest
        run: |
          python3 scripts/apply_native_branding.py flutter_app
          if [ "$APP_TARGET" = tv ]; then python3 scripts/configure_tv_manifest.py flutter_app; fi
      - name: Resolve dependencies
        working-directory: flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Analyze and test
        working-directory: flutter_app
        run: |
          flutter analyze
          flutter test --dart-define="AL_QAHTANI_TARGET=$APP_TARGET"
          dart run tool/alooy_bridge_smoke.dart
      - name: Build APK with deployed API and requested architecture
        working-directory: flutter_app
        run: flutter build apk --release --split-per-abi --target-platform="$TARGET_PLATFORM" --dart-define="AL_QAHTANI_TARGET=$APP_TARGET" --dart-define="MATV_API_BASE=$MATV_API_BASE"
      - name: Verify and stage APK
        run: |
          set -euo pipefail
          APK="flutter_app/build/app/outputs/flutter-apk/app-$EXPECTED_ABI-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify "$APK"
          "$AAPT" dump permissions "$APK" > /tmp/matv-permissions.txt
          grep -q android.permission.INTERNET /tmp/matv-permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/matv-manifest.txt
          grep -q networkSecurityConfig /tmp/matv-manifest.txt
          "$AAPT" dump badging "$APK" > /tmp/matv-badging.txt
          grep -qx "native-code: '$EXPECTED_ABI'" /tmp/matv-badging.txt || { cat /tmp/matv-badging.txt; exit 1; }
          if [ "$APP_TARGET" = tv ]; then grep -q android.software.leanback /tmp/matv-badging.txt; fi
          mkdir -p trial
          cp "$APK" "trial/$ARTIFACT_NAME.apk"
          sha256sum "trial/$ARTIFACT_NAME.apk" > "trial/$ARTIFACT_NAME.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: trial/
          retention-days: 14

  ios-unsigned:
    needs: [verify-api, providers]
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      MATV_API_BASE: ${{ inputs.api_base || 'https://matv.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Create iOS scaffolding
        working-directory: flutter_app
        run: flutter create --platforms=ios --org com.alqahtani --project-name al_qahtani .
      - name: Apply native branding
        run: python3 scripts/apply_native_branding.py flutter_app
      - name: Resolve dependencies
        working-directory: flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Build unsigned iPhone app with deployed API
        working-directory: flutter_app
        run: flutter build ios --release --no-codesign --dart-define=AL_QAHTANI_TARGET=ios --dart-define="MATV_API_BASE=$MATV_API_BASE"
      - name: Package unsigned IPA for external signing
        run: |
          set -euo pipefail
          test -s flutter_app/build/ios/iphoneos/Runner.app/Runner
          mkdir -p trial/Payload
          cp -R flutter_app/build/ios/iphoneos/Runner.app trial/Payload/Runner.app
          rm -rf trial/Payload/Runner.app/_CodeSignature
          rm -f trial/Payload/Runner.app/embedded.mobileprovision
          codesign --remove-signature trial/Payload/Runner.app 2>/dev/null || true
          if codesign --verify trial/Payload/Runner.app 2>/dev/null; then echo 'Unexpected signed app'; exit 1; fi
          lipo -info trial/Payload/Runner.app/Runner | grep -q arm64
          cd trial
          ditto -c -k --keepParent Payload MATV-iPhone-Unsigned.ipa
          shasum -a 256 MATV-iPhone-Unsigned.ipa > MATV-iPhone-Unsigned.ipa.sha256
          rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MATV-iPhone-Unsigned
          path: trial/
          retention-days: 14

  verify-release:
    needs: [android, ios-unsigned]
    if: startsWith(github.ref, 'refs/heads/build/matv-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: device-artifacts
      - name: Verify all packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          read VERSION BUILD < <(python3 - <<'PY_VERSION'
          import pathlib, re
          m=re.search(r'^version: (\d+\.\d+\.\d+)\+(\d+)$',pathlib.Path('flutter_app/pubspec.yaml').read_text(),re.M)
          assert m
          print(*m.groups())
          PY_VERSION
          )
          python3 scripts/verify_device_artifacts.py device-artifacts https://matv.onrender.com "$VERSION" "$BUILD" > device-verification.json
          cat device-verification.json
          python3 - <<'PY_NOTES'
          from pathlib import Path
          report=Path('device-verification.json').read_text().replace('%','%25').replace('\n','%0A')
          print('::notice title=Device artifact verification::'+report)
          Path('/tmp/release-notes.md').write_text("Alooy TV, local Range stream bridge, unified fallback and cinematic controls.\n\nAndroid Mobile ARM64, Android TV ARMv7 and unsigned iOS ARM64. External signing is required for IPA installation.\n\nChecksums, architecture, libmpv and public API verification passed. Physical-device battery and thermal tests remain pending.\n\nFlutter Web: https://th-505.github.io/MATV/app/\n")
          PY_NOTES
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$BUILD_SHA" --title "MATV $VERSION" --notes-file /tmp/release-notes.md device-artifacts/*/*.apk device-artifacts/*/*.ipa device-artifacts/*/*.sha256 device-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: MATV-device-verification
          path: device-verification.json
          retention-days: 14
