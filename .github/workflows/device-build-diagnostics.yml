name: Diagnose MATV device build
on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - name: Report verification failure
        run: |
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" > build.log 2>&1 || true
          python3 - <<'PY'
          import pathlib
          lines = pathlib.Path('build.log').read_text().splitlines()
          end = next((i for i, line in enumerate(lines) if 'Post job cleanup.' in line), len(lines))
          excerpt = '\n'.join(lines[max(0, end-70):end])
          excerpt = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=Build verification log::' + excerpt)
          PY
