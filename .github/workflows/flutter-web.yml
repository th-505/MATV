name: Najd TV internal Web build

on:
  workflow_call:
    inputs:
      api_base:
        description: Public metadata API URL, identical to the native builds
        required: true
        type: string

permissions:
  contents: read

env:
  MITV_API_BASE: ${{ inputs.api_base }}
  MITV_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned icon packager
        run: python -m pip install -r scripts/requirements-branding.txt
      - name: Apply approved Web branding
        run: python3 scripts/apply_native_branding.py flutter_app
      - name: Build and verify Flutter Web
        working-directory: flutter_app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test --dart-define=MITV_TARGET=web
          dart run tool/alooy_bridge_smoke.dart
          flutter build web --release --no-web-resources-cdn --base-href=/internal/ --dart-define=MITV_TARGET=web --dart-define="MITV_API_BASE=$MITV_API_BASE"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install locked browser-test dependencies
        timeout-minutes: 3
        run: npm ci
      - name: Prepare hash-verified offline MP4 and HLS fixtures
        timeout-minutes: 1
        run: python3 scripts/prepare_codec_fixtures.py
      - name: Verify source episode and output escaping in Chromium
        timeout-minutes: 2
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: node scripts/episode_identity_browser_test.mjs
      - name: Verify Chromium MP4 playback with offline Auth fixtures
        timeout-minutes: 2
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: node scripts/flutter_web_smoke.mjs
      - name: Verify Chromium HLS playback with offline Auth fixtures
        timeout-minutes: 2
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: node scripts/flutter_web_smoke.mjs hls
      - name: Record immutable source identity and package Web bundle
        run: |
          set -euo pipefail
          python3 scripts/write_source_manifest.py --target web --output flutter_app/build/web/source-manifest.json --api "$MITV_API_BASE" --sha "$MITV_SOURCE_COMMIT"
          mkdir -p trial
          cp flutter_app/build/web/source-manifest.json trial/source-manifest.json
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('flutter_app/build/web')
          with zipfile.ZipFile('trial/Najd-TV-Web.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as package:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and path.suffix not in ('.symbols', '.map'):
                      package.write(path, path.relative_to(root))
          PY
          (cd trial && sha256sum Najd-TV-Web.zip > Najd-TV-Web.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: Najd-TV-Flutter-Web
          path: trial/
          retention-days: 14
          if-no-files-found: error
