name: MA TV Web build for unified release

on:
  workflow_call:
    inputs:
      api_base:
        description: Public metadata API URL, identical to the native builds
        required: true
        type: string

permissions:
  contents: read

env:
  MITV_API_BASE: ${{ inputs.api_base }}
  MITV_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Apply approved Web branding
        run: python3 scripts/apply_native_branding.py flutter_app
      - name: Build and verify Flutter Web
        working-directory: flutter_app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test --dart-define=MITV_TARGET=web
          dart run tool/alooy_bridge_smoke.dart
          flutter build web --release --no-web-resources-cdn --base-href=/MATV/app/ --dart-define=MITV_TARGET=web --dart-define="MITV_API_BASE=$MITV_API_BASE"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install locked browser-test dependencies
        timeout-minutes: 3
        run: npm ci
      - name: Install codec fixture tools
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Generate bounded local codec fixtures
        timeout-minutes: 1
        run: |
          mkdir -p /tmp/matv-codec-fixtures
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=160x90:rate=10 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 3 -c:v libx264 -c:a aac -movflags +faststart -y /tmp/matv-codec-fixtures/sample.mp4
          ffmpeg -hide_banner -loglevel error -i /tmp/matv-codec-fixtures/sample.mp4 -c copy -hls_time 1 -hls_segment_filename /tmp/matv-codec-fixtures/master%d.ts -y /tmp/matv-codec-fixtures/master.m3u8
      - name: Verify source episode and output escaping in Chromium
        timeout-minutes: 2
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: node scripts/episode_identity_browser_test.mjs
      - name: Verify Chromium MP4 playback with offline Auth fixtures
        timeout-minutes: 2
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: node scripts/flutter_web_smoke.mjs
      - name: Verify Chromium HLS playback with offline Auth fixtures
        timeout-minutes: 2
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: node scripts/flutter_web_smoke.mjs hls
      - name: Record immutable source identity and package Web bundle
        run: |
          set -euo pipefail
          python3 scripts/write_source_manifest.py --target web --output flutter_app/build/web/source-manifest.json --api "$MITV_API_BASE" --sha "$MITV_SOURCE_COMMIT"
          mkdir -p trial
          cp flutter_app/build/web/source-manifest.json trial/source-manifest.json
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('flutter_app/build/web')
          with zipfile.ZipFile('trial/MA-TV-Web.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as package:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      package.write(path, path.relative_to(root))
          PY
          (cd trial && sha256sum MA-TV-Web.zip > MA-TV-Web.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: MA-TV-Flutter-Web
          path: trial/
          retention-days: 14
          if-no-files-found: error
