name: MITV Flutter Web
on:
  push:
    branches: [main, 'web/mitv-*']
    paths: ['flutter_app/**', '.github/workflows/flutter-web.yml', '.github/workflows/mobile-trial.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
  pages: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build and verify Flutter Web
        working-directory: flutter_app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          dart run tool/alooy_bridge_smoke.dart
          flutter build web --release --no-web-resources-cdn --base-href=/MATV/app/ --dart-define=MITV_API_BASE=https://matv.onrender.com
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Verify Chromium MP4 and HLS playback
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: |
          npm ci
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          mkdir -p /tmp/matv-codec-fixtures
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=160x90:rate=10 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 3 -c:v libx264 -c:a aac -movflags +faststart -y /tmp/matv-codec-fixtures/sample.mp4
          ffmpeg -hide_banner -loglevel error -i /tmp/matv-codec-fixtures/sample.mp4 -c copy -hls_time 1 -hls_segment_filename /tmp/matv-codec-fixtures/master%d.ts -y /tmp/matv-codec-fixtures/master.m3u8
          node scripts/flutter_web_smoke.mjs
          node scripts/flutter_web_smoke.mjs hls
      - name: Stage both web surfaces
        run: |
          mkdir -p site/app
          cp ./*.html site/
          cp -R web site/web
          cp -R flutter_app/build/web/. site/app/
      - uses: actions/upload-artifact@v4
        with:
          name: MITV-Flutter-Web
          path: site/
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MITV-Flutter-Web
          path: site
      - name: Publish through the configured Pages source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p app
          cp -R site/app/. app/
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Flutter Web bundle [skip ci] [skip render]'
            git push origin HEAD:main
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
