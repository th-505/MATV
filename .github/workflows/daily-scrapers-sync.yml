name: Najd daily provider report
on:
  push:
    branches: [feat/najd-1.1.3, feat/najd-1.1.5]
    paths:
      - .github/workflows/daily-scrapers-sync.yml
      - scripts/najd_daily_report.py
      - scripts/test_najd_daily_report.py
      - scripts/najd_verified_repairs.py
      - scripts/test_najd_verified_repairs.py
      - scripts/najd_provider_forms.mjs
      - scripts/najd_provider_report_registry.mjs
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'
permissions:
  contents: write
  id-token: write
  issues: write
concurrency:
  group: najd-production-source
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test report isolation and redaction
        run: python -m unittest discover -s scripts -p 'test_najd*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install application dependencies
        timeout-minutes: 3
        run: npm ci --ignore-scripts
      - name: Export actual registered providers
        run: node scripts/najd_provider_report_registry.mjs > /tmp/najd-registry.json
      - name: Install analyzer dependencies
        run: python -m pip install requests==2.32.5
      - name: Inspect provider transport availability
        timeout-minutes: 12
        run: python scripts/matv_provider_analyzer.py --registry /tmp/najd-registry.json --out-dir /tmp/najd-provider-diagnostics
      - name: Collect bounded observed search forms
        timeout-minutes: 5
        run: node scripts/najd_provider_forms.mjs /tmp/najd-provider-forms.json
      - name: Generate bounded Gemini diagnosis and GitHub summary
        timeout-minutes: 4
        env:
          NAJD_AUTO_REPAIR: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
        run: python scripts/najd_daily_report.py --input /tmp/najd-provider-diagnostics/provider-diagnostics.json --out-dir /tmp/najd-report --forms /tmp/najd-provider-forms.json
      - name: Update owner report in GitHub Issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = '/tmp/najd-report/maintenance-report.md';
            if (!fs.existsSync(reportPath)) throw new Error('Maintenance report missing');
            const body = fs.readFileSync(reportPath, 'utf8');
            if (body.length > 50000 || !body.startsWith('<!-- najd-daily-maintenance -->')) throw new Error('Invalid report');
            const title = 'Najd TV — تقرير القواشط اليومي';
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state:'open', creator:'github-actions[bot]', per_page:100});
            const existing = issues.find(x => !x.pull_request && x.title === title && x.body?.startsWith('<!-- najd-daily-maintenance -->'));
            const run = `\n\n[تفاصيل تشغيل GitHub Actions](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            if (existing) await github.rest.issues.update({...context.repo, issue_number:existing.number, body:body + run});
            else await github.rest.issues.create({...context.repo, title, body:body + run});
      - name: Persist only verified maintenance discoveries
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const report=JSON.parse(fs.readFileSync('/tmp/najd-report/maintenance-report.json','utf8'));
            const allowed=new Set(['primary_domain','search_path','search_parameter','search_method','card_selector','title_selector','link_selector','poster_selector','year_selector','default_type']);
            const applied=(report.repairs||[]).filter(r=>r.status==='applied'&&r.evidence?.positive_identity===true&&r.evidence?.negative_empty===true&&/^[a-z0-9][a-z0-9_-]{1,29}$/.test(r.provider)&&Object.entries(r.config||{}).every(([k,v])=>allowed.has(k)&&typeof v==='string'&&v.length<=300));
            if(!applied.length){core.info('No verified discoveries to persist');return;}
            const path='docs/najd/maintenance-knowledge.json';
            const previous=await github.rest.repos.getContent({...context.repo,path,ref:'main'});
            const knowledge=JSON.parse(Buffer.from(previous.data.content,'base64').toString());
            const entries=[...(knowledge.discoveries||[]),...applied.map(r=>({provider:r.provider,revision:r.revision,config:r.config,evidence:r.evidence}))];
            const unique=new Map(entries.map(r=>[r.provider+':'+JSON.stringify(Object.fromEntries(Object.entries(r.config||{}).sort())),r]));
            const content=JSON.stringify({schema_version:1,discoveries:[...unique.values()].slice(-50)},null,2)+'\n';
            if(Buffer.byteLength(content)>50000)throw Error('Knowledge size limit');
            await github.rest.repos.createOrUpdateFileContents({...context.repo,path,branch:'main',sha:previous.data.sha,message:'Record verified Najd provider discovery [skip ci] [skip render]',content:Buffer.from(content).toString('base64')});
      - name: Upload sanitized report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: najd-daily-report
          path: /tmp/najd-report/
          retention-days: 14
          if-no-files-found: warn
