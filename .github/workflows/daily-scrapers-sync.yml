name: Najd daily provider report
on:
  push:
    branches: [feat/najd-1.1.3]
    paths:
      - .github/workflows/daily-scrapers-sync.yml
      - scripts/najd_daily_report.py
      - scripts/test_najd_daily_report.py
      - scripts/najd_provider_report_registry.mjs
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: najd-daily-provider-report
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test report isolation and redaction
        run: python -m unittest discover -s scripts -p 'test_najd_daily_report.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install application dependencies
        timeout-minutes: 3
        run: npm ci --ignore-scripts
      - name: Export actual registered providers
        run: node scripts/najd_provider_report_registry.mjs > /tmp/najd-registry.json
      - name: Install analyzer dependencies
        run: python -m pip install requests==2.32.5
      - name: Inspect provider transport availability
        timeout-minutes: 12
        run: python scripts/matv_provider_analyzer.py --registry /tmp/najd-registry.json --out-dir /tmp/najd-provider-diagnostics
      - name: Generate bounded Gemini diagnosis and GitHub summary
        timeout-minutes: 4
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
        run: python scripts/najd_daily_report.py --input /tmp/najd-provider-diagnostics/provider-diagnostics.json --out-dir /tmp/najd-report
      - name: Update owner report in GitHub Issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = '/tmp/najd-report/maintenance-report.md';
            if (!fs.existsSync(reportPath)) throw new Error('Maintenance report missing');
            const body = fs.readFileSync(reportPath, 'utf8');
            if (body.length > 50000 || !body.startsWith('<!-- najd-daily-maintenance -->')) throw new Error('Invalid report');
            const title = 'Najd TV — تقرير القواشط اليومي';
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state:'open', creator:'github-actions[bot]', per_page:100});
            const existing = issues.find(x => !x.pull_request && x.title === title && x.body?.startsWith('<!-- najd-daily-maintenance -->'));
            const run = `\n\n[تفاصيل تشغيل GitHub Actions](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            if (existing) await github.rest.issues.update({...context.repo, issue_number:existing.number, body:body + run});
            else await github.rest.issues.create({...context.repo, title, body:body + run});
      - name: Upload sanitized report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: najd-daily-report
          path: /tmp/najd-report/
          retention-days: 14
          if-no-files-found: warn
