name: MATV nightly provider diagnostics
on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: npm ci --ignore-scripts
      - name: Validate modified JavaScript syntax
        run: |
          node --check server/scrapers/index.mjs
          node --check server/tmdb-runtime.mjs
          node --check server/fallback-providers.mjs
          node --check server/discovery-coordinator.mjs
          npm run test:continuation
      - name: Install analyzer dependencies
        run: python -m pip install requests
      - name: Inspect configured secret names (never print values)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          TMDB_API_KEY_BP: ${{ secrets.TMDB_API_KEY_BP }}
          TMDB_API_KEY_OL: ${{ secrets.TMDB_API_KEY_OL }}
        run: |
          python - <<'PY'
          import os
          for name in ('GEMINI_API_KEY', 'GEMINI_API_KEY_BACKUP', 'TMDB_API_KEY_BP', 'TMDB_API_KEY_OL'):
              print(f"{name}: {'configured' if os.getenv(name) else 'missing'}")
          PY
      - name: Discover every local provider and run diagnostics
        run: |
          python scripts/matv_provider_analyzer.py --registry server/scrapers/providers-registry.json --out-dir server/scrapers/generated
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-diagnostics
          path: |
            server/scrapers/providers-registry.json
            server/scrapers/generated/
          if-no-files-found: warn
