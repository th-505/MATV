name: Najd 1.1.5 staged verification
on:
  push:
    branches: [feat/najd-1.1.5]
permissions:
  contents: read
concurrency:
  group: najd-feature-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: python -m pip install -r scripts/requirements-branding.txt
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:continuation
      - run: node --test tests/*.test.mjs
      - run: python scripts/platform_parity_test.py
      - run: python .github/scripts/check_repo_health.py
      - run: docker build -t najd-feature .
      - run: docker run --rm --network none --mount "type=bind,src=${{ github.workspace }}/scripts/container_runtime_smoke.mjs,dst=/tmp/container-smoke.mjs,readonly" najd-feature node /tmp/container-smoke.mjs
  internal-web:
    uses: ./.github/workflows/flutter-web.yml
    with:
      api_base: https://matv.onrender.com
