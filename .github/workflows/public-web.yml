name: Najd TV public application on GitHub Pages

on:
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/public-web.yml'
      - 'scripts/verify_public_web.py'
  workflow_dispatch:
    inputs:
      api_base:
        description: Public metadata API used by the native applications
        required: true
        default: https://matv.onrender.com
        type: string

permissions:
  contents: read

concurrency:
  group: najd-public-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MITV_API_BASE: ${{ inputs.api_base || 'https://matv.onrender.com' }}
      MITV_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Verify public URL
        run: |
          python3 - <<'PY'
          import os, urllib.parse
          value = urllib.parse.urlsplit(os.environ['MITV_API_BASE'])
          assert value.scheme == 'https' and value.hostname
          assert not value.username and not value.password and not value.query and not value.fragment
          PY
      - name: Verify application
        working-directory: flutter_app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test --dart-define=MITV_TARGET=web
      - name: Build the complete public application
        working-directory: flutter_app
        run: |
          flutter build web --release --no-web-resources-cdn --base-href=/NajdTV/ --dart-define=MITV_TARGET=web --dart-define="MITV_API_BASE=$MITV_API_BASE" --dart-define=MITV_INTERNAL_WEB_BASE=https://th-505.github.io/NajdTV/
      - name: Verify bundle and immutable source identity
        run: |
          python3 scripts/write_source_manifest.py --target web --output flutter_app/build/web/source-manifest.json --api "$MITV_API_BASE" --sha "$MITV_SOURCE_COMMIT"
          python3 scripts/verify_public_web.py flutter_app/build/web
          touch flutter_app/build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_app/build/web

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: /tmp/najd-public-pages
      - name: Publish verified files using the existing Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYWEB'
          import pathlib, tarfile
          root=pathlib.Path('/tmp/najd-public-pages')
          with tarfile.open(root/'artifact.tar') as package:
              for item in package.getmembers():
                  path=pathlib.PurePosixPath(item.name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert not item.issym() and not item.islnk()
              package.extractall(root/'site',filter='data')
          PYWEB
          python3 scripts/publish_legacy_pages.py /tmp/najd-public-pages/site
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish verified Najd public application [skip ci]'
            git push origin main
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
