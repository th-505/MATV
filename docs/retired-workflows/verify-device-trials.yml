name: Verify MATV device artifacts
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful MATV device trials run ID
        required: true
        type: string
      publish:
        description: Publish the verified triplet as a GitHub Release
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify build outputs
        run: |
          set -euo pipefail
          gh run watch "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status
          gh run view "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion | grep -qx success
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --dir device-artifacts
          BUILD_SHA="$(gh run view "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          [[ "$BUILD_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/contents/flutter_app/pubspec.yaml?ref=$BUILD_SHA" --jq .content | base64 -d > /tmp/build-pubspec.yml
          read VERSION BUILD < <(python3 - <<'PY_VERSION'
          import pathlib, re
          match = re.search(r'^version: (\d+\.\d+\.\d+)\+(\d+)$', pathlib.Path('/tmp/build-pubspec.yml').read_text(), re.M)
          assert match
          print(*match.groups())
          PY_VERSION
          )
          python3 scripts/verify_device_artifacts.py device-artifacts https://matv.onrender.com "$VERSION" "$BUILD" > device-verification.json
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          for APK in device-artifacts/*/*.apk; do
            "$AAPT" dump badging "$APK" > /tmp/device-badging.txt
            case "$APK" in
              *Mobile-ARM64.apk) EXPECTED_CODE=$((2000 + BUILD)) ;;
              *TV-ARM32.apk) EXPECTED_CODE=$((1000 + BUILD)) ;;
              *) exit 1 ;;
            esac
            grep -q "versionCode='$EXPECTED_CODE' versionName='$VERSION'" /tmp/device-badging.txt
          done
          cat device-verification.json
          python3 - <<'PY_REPORT'
          import pathlib
          report = pathlib.Path('device-verification.json').read_text().replace('%', '%25').replace('\n', '%0A')
          print('::notice title=Device artifact verification::' + report)
          PY_REPORT
      - uses: actions/upload-artifact@v4
        with:
          name: MATV-device-verification
          path: device-verification.json
          retention-days: 14

      - name: Publish verified device triplet
        if: inputs.publish == true
        run: |
          set -euo pipefail
          BUILD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .head_sha)"
          VERSION="$(python3 - <<'PY_VERSION'
          import pathlib, re
          print(re.search(r'^version: (\d+\.\d+\.\d+)\+', pathlib.Path('/tmp/build-pubspec.yml').read_text(), re.M).group(1))
          PY_VERSION
          )"
          TAG="v$VERSION"
          python3 - <<'PY_NOTES'
          from pathlib import Path
          Path('/tmp/release-notes.md').write_text("Alooy TV with a local ranged stream bridge, unified source fallback, and cinematic player controls.\n\nAndroid Mobile: ARM64. Android TV: ARMv7. iOS: unsigned ARM64 IPA, external signing required.\n\nAll three binaries passed checksum, architecture, decoder and deployed API verification. Physical-device thermal and battery testing remains pending.\n\nFlutter Web: https://th-505.github.io/MATV/app/\n")
          PY_NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$BUILD_SHA" --title "MATV $VERSION" --notes-file /tmp/release-notes.md device-artifacts/*/*.apk device-artifacts/*/*.ipa device-artifacts/*/*.sha256 device-verification.json
